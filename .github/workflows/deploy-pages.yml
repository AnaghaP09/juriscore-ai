name: Deploy landing page

# Publishes the static site in `landing/` to GitHub Pages: home, release notes, and the
# Setup and Run pages rendered from their Markdown sources at deploy time.
# The full app (SSR + MCP server) is not hosted here — only the landing page.

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "docs/GATEWAY_SETUP.md"
      - "packaging/RUN.md"
      - "docs/RELEASE_NOTES.md"
      - "scripts/build-landing-docs.ts"
      - "scripts/check-landing-docs.ts"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # Setup, Run and Release notes pages are rendered from their Markdown sources at
      # deploy time (PLAN-7). Node built-ins only, so no dependency install is needed.
      - name: Render Setup, Run and Release notes pages
        run: bun scripts/build-landing-docs.ts

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload landing page artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: landing

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
